[project]
name = "easycode-backend"
version = "0.1.1"
description = "EasyCode local-first algorithm training backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "sqlalchemy>=2.0.51",
    "alembic>=1.19.1",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.0.1",
    "openai>=2.53.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.4",
]

[dependency-groups]
desktop = [
    "pyinstaller==6.22.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
