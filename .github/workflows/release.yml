name: Desktop Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon
            os: macos-15
            builder_args: --mac dmg zip --arm64
            artifact: macos-arm64
          - label: macOS Intel
            os: macos-15-intel
            builder_args: --mac dmg zip --x64
            artifact: macos-x64
          - label: Windows x64
            os: windows-latest
            builder_args: --win nsis zip --x64
            artifact: windows-x64
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            frontend/pnpm-lock.yaml
            desktop/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v10.0.0
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
          python-version: "3.12"
      - name: Verify release version
        shell: bash
        run: |
          python scripts/check_release_versions.py
          if [[ "${GITHUB_REF}" == refs/tags/* ]] && [[ "${GITHUB_REF_NAME}" != "v$(cat VERSION)" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION v$(cat VERSION)" >&2
            exit 1
          fi
      - name: Build frontend
        working-directory: frontend
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          VITE_API_BASE=/api pnpm build
      - name: Build native backend
        shell: bash
        run: |
          uv sync --project backend --frozen --group desktop
          uv run --project backend --group desktop python scripts/build_desktop_backend.py
      - name: Package desktop app
        working-directory: desktop
        shell: bash
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level low
          pnpm exec electron-builder ${{ matrix.builder_args }}
      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: easycode-${{ matrix.artifact }}
          path: |
            desktop/release/*.dmg
            desktop/release/*.zip
            desktop/release/*.exe
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${GITHUB_REF_NAME}"
          release-assets/*
          --repo "${GITHUB_REPOSITORY}"
          --title "EasyCode ${GITHUB_REF_NAME}"
          --prerelease
          --generate-notes
          --notes "Desktop preview release. Packages are currently unsigned; see the README for Gatekeeper and SmartScreen guidance."
